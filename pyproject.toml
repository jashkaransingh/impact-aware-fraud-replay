[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "impact-replay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "joblib", "torch", "torch-geometric", "matplotlib"]
[tool.setuptools.packages.find]
where = ["src"]
